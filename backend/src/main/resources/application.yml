server:
  port: 8080

spring:
  application:
    name: ai-blog-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:aiblog}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置：生产环境必须通过环境变量覆盖密钥
jwt:
  secret: ${JWT_SECRET:aiblog-dev-secret-key-change-me-in-production-0123456789}
  expire-hours: ${JWT_EXPIRE_HOURS:72}

# 文件上传：图片落盘到本地目录，/uploads/** 对外提供访问
upload:
  dir: ${UPLOAD_DIR:./uploads}
  max-size-bytes: 5242880
  allowed-extensions: jpg,jpeg,png,gif,webp

# Python AI 服务（/v1 前缀，共享密钥见接口契约 5.3）
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  internal-token: ${AI_INTERNAL_TOKEN:dev-internal-token}
  # Java 对外可访问地址：散文任务用它把 /uploads/** 拼成 Python 可直接下载的绝对 URL
  public-base-url: ${AI_PUBLIC_BASE_URL:http://localhost:8080}
  # P1 向量同步开关：发布/更新/删除文章后异步通知 Python（失败仅记日志）
  vector-sync-enabled: ${AI_VECTOR_SYNC_ENABLED:true}
  connect-timeout-ms: 3000
  read-timeout-ms: 120000
  # Java 侧建立到 Python 的连接的最长等待（> 连接超时 3s）
  pre-stream-wait-seconds: 5
  sse-timeout-ms: 120000
  # P1 语义搜索读超时（独立于生成的 120s，避免用户久等）
  search-read-timeout-ms: 10000
  # 全文审阅读超时（非流式结构化建议，独立于生成的 120s）
  review-read-timeout-ms: ${AI_REVIEW_READ_TIMEOUT_MS:60000}
  # P1 语义搜索结果条数上限
  search-max-top-k: 20
  # 演示开关：填入 JSON 数组时跳过 Python 直接返回 mock hits，默认空=关闭
  search-mock-hits: ${AI_SEARCH_MOCK_HITS:}

logging:
  level:
    com.aiblog: info

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 人文关怀检测（契约 5.8）：发布时情绪/危机检测，超时或异常按无风险放行（fail-open）
app:
  init:
    admin-username: ${ADMIN_INIT_USERNAME:admin}
    admin-password: ${ADMIN_INIT_PASSWORD:admin123}
  site:
    # sitemap.xml 中拼接文章绝对地址的前缀，生产环境应配置为正式域名
    base-url: ${SITE_BASE_URL:http://localhost}
  ai:
    daily-quota: ${AI_DAILY_QUOTA:200}
  care:
    timeout-ms: 5000
    # 演示开关：注入 none/low/mid/high 时跳过 Python 检测直接返回该级别，默认空=关闭
    mock-level: ${CARE_MOCK_LEVEL:}
